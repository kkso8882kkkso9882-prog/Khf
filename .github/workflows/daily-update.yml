name: Executor status board (every 15 min)

on:
  schedule:
    # ทุก 15 นาที
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "บังคับรีเฟรช (ปกติรีเฟรชอยู่แล้ว)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

concurrency:
  group: executor-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Discord webhook secret
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::ยังไม่ได้ตั้ง secret DISCORD_WEBHOOK_URL"
            echo "ไปที่ Settings → Secrets and variables → Actions → New repository secret"
            echo "Name: DISCORD_WEBHOOK_URL"
            echo "แล้ววาง webhook URL ของ Discord"
            exit 1
          fi
          echo "พบ webhook secret แล้ว"

      - name: Run bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            EXTRA="--force"
            echo "โหมด force"
          fi
          python -u executor_watch.py $EXTRA

      - name: Save state back to the repo
        run: |
          git config user.name "executor-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f state.json ]; then
            git add state.json
            if git diff --cached --quiet; then
              echo "state ไม่เปลี่ยน"
            else
              git commit -m "chore: update executor state $(date -u +%F %H:%M)"
              git push
            fi
          else
            echo "ไม่มี state.json"
          fi

      - name: Keep the daily report
        uses: actions/upload-artifact@v4
        with:
          name: executor-report-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 7
